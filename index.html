  --lime-text:#4F6B00; --lime-text-2:#6B8F00; --lime-text-3:#3D5400;
  --ink:#0B1220; --ink-on-lime:#0B0B0B; --slate:#5B6472; --muted:#9AA5B4;
  --surface:#FFFFFF; --canvas:#F4F6FA; --canvas-alt:#E8ECF2; --info:#E8F1FE; --hairline:#E3E8EF;

  --o-surface:rgba(255,255,255,0.12);
  --o-control:rgba(255,255,255,0.14);
  --o-pressed:rgba(255,255,255,0.26);
  --o-disabled:rgba(255,255,255,0.08);
  --o-border:rgba(255,255,255,0.35);
  --t-2:rgba(255,255,255,0.85);
  --t-3:rgba(255,255,255,0.7);
  --t-4:rgba(255,255,255,0.45);

  --safe-top:62px;
  --font:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);background:var(--canvas-alt);
  color:#fff;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
}
button{font:inherit;color:inherit;background:none;border:0;margin:0;cursor:pointer}
input{font:inherit}
img{display:block}

/* The screen. 390×844 is the design frame; it fills the viewport on a real device. */
#screen{
  width:100%;max-width:390px;height:100dvh;max-height:844px;
  background:var(--blue);overflow:hidden;position:relative;
  display:flex;flex-direction:column;
}
/* --- PROTOTYPE DEVICE FRAMING ---------------------------------------------
   Per CLAUDE.md the 40px radius and outer shadow are review-only framing.
   They apply on wide viewports so the page can be checked on a desktop.
   Delete this one block when embedding in the app.                          */
@media (min-width:520px) and (min-height:900px){
  #screen{height:844px;border-radius:40px;box-shadow:0 16px 40px rgba(10,42,94,0.22)}
}
/* -------------------------------------------------------------------------- */

.safe{height:var(--safe-top);flex:none}
.view{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
.view.light{background:var(--canvas)}
.fade{animation:fade 180ms ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.deco{position:absolute;border-radius:50%;pointer-events:none}

/* type */
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.eyebrow.lg{font-size:12px;letter-spacing:.16em}
.eyebrow.dim{color:var(--t-3)}
.h1{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:#fff}
.title{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em;white-space:nowrap}

/* buttons */
.cta{display:block;width:100%;text-align:center;border-radius:18px;font-weight:800}
.cta.lime{background:var(--lime);color:var(--ink-on-lime);font-size:19px;padding:19px}
.cta.white{background:#fff;color:var(--blue);font-size:19px;padding:20px}
.cta.blue{background:var(--blue);color:#fff;font-size:18px;padding:19px}
.cta[disabled]{opacity:.45;cursor:default}
.cta:active:not([disabled]){filter:brightness(.95)}
.linkbtn{font-size:15px;font-weight:700;color:#fff;text-align:center;padding:12px;width:100%}
.linkbtn.lime{color:var(--lime)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}

/* ---------- 2. round ---------- */
.head{padding:10px 24px 0;display:flex;align-items:center;justify-content:space-between}
.headcol{display:flex;flex-direction:column;gap:3px}
.bars{display:flex;gap:7px;padding:16px 24px 0}
.bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,0.28)}
.bar.on{background:var(--lime)}
.bar.miss{background:rgba(255,255,255,0.55)}
.panel{margin:18px 24px 0;background:#fff;border-radius:28px;padding:18px;flex:none;box-shadow:0 6px 20px rgba(11,18,32,0.12)}
.well{height:258px;border-radius:20px;overflow:hidden;position:relative;background:var(--canvas-alt)}
.well img{width:100%;height:100%;object-fit:cover;transform-origin:center}
.timer{position:absolute;right:14px;top:14px;width:58px;height:58px;border-radius:50%;background:#fff;border:4px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:var(--ink)}
.timer svg{position:absolute;inset:-4px;width:58px;height:58px;transform:rotate(-90deg)}
.timer span{position:relative}
.points{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 2px}
.points .lbl{font-size:15px;font-weight:700;color:var(--slate)}
.points .val{font-size:26px;font-weight:800;color:var(--blue);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.answers{margin:16px 24px 0;display:flex;flex-direction:column;gap:10px}
.prompt{font-size:15px;font-weight:700;color:var(--t-2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--o-control);color:#fff;font-size:17px;font-weight:700;padding:19px 0;border-radius:16px;text-align:center;transition:background 90ms linear}
.opt:active{background:var(--o-pressed)}
.opt.correct{background:var(--lime);color:var(--ink-on-lime);font-weight:800}
.opt.picked{background:var(--o-disabled);border:1.5px solid rgba(255,255,255,0.5);padding:17.5px 0}
.opt.dim{background:var(--o-disabled);color:var(--t-4)}
.foot{margin:auto 24px 0;padding-bottom:26px}
.skip{display:block;width:100%;font-size:16px;font-weight:700;color:rgba(255,255,255,0.78);text-align:center;padding:14px}

/* ---------- 3/4. reveal ---------- */
.reveal{margin:20px 24px 0;height:268px;border-radius:26px;background:#fff;overflow:hidden;position:relative}
.reveal img{width:100%;height:100%;object-fit:cover}
.pill-brand{position:absolute;left:16px;top:16px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border-radius:999px;animation:fade 220ms ease-out 120ms both}
.pill-brand.win{background:var(--lime);color:var(--ink-on-lime)}
.pill-brand.lose{background:rgba(11,18,32,0.72);color:#fff}
.strip{margin:16px 24px 0;border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.strip.win{background:rgba(204,255,0,0.16);border:1.5px solid var(--lime)}
.strip.lose{background:var(--o-surface)}
.strip .l{font-size:16px;font-weight:700}
.strip .r{font-size:22px;font-weight:800}

/* ---------- 5/6/7. outcome ---------- */
.pad30{padding-left:30px;padding-right:30px}
.card{background:#fff;border-radius:28px;color:var(--ink)}
.tile{background:#fff;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.inforow{background:var(--o-surface);border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;font-size:15px}
.inforow .k{font-weight:600;color:var(--t-2)}
.inforow .v{font-weight:800;color:#fff}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}

/* ---------- 9/10/11. history ---------- */
.lightbg{background:var(--canvas);color:var(--ink)}
.hhead{background:var(--blue);padding:62px 24px 24px;color:#fff;flex:none}
.closebtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex:none}
.stat{flex:1;background:var(--o-control);border-radius:16px;padding:14px 16px}
.row{background:#fff;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.ricon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;flex:none}
.thumb{width:40px;height:40px;border-radius:12px;object-fit:cover;background:var(--canvas-alt);flex:none}

/* ---------- boot / error ---------- */
.progress{height:6px;border-radius:3px;background:var(--o-disabled);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--lime);transition:width 200ms linear}

@media (prefers-reduced-motion:reduce){
  .fade,.pill-brand{animation:none}
  .opt{transition:none}
}
</style>
</head>

/* ==========================================================================
   2. Day key — Africa/Lagos is the ONLY day key (CLAUDE.md guardrail)
   ========================================================================== */
var lagosFmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Lagos" });
function lagosDay(d) { return lagosFmt.format(d || new Date()); }

/* Next 00:00 WAT as epoch ms. Lagos is UTC+1 year-round, no DST. */
function nextLagosMidnight() {
  var p = lagosDay().split("-");
  return Date.UTC(+p[0], +p[1] - 1, +p[2] + 1, 0, 0, 0) - 3600000;
}
function countdownText(ms) {
  if (ms < 0) ms = 0;
  var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + "h " + m + "m";
  return m + "m " + (s % 60) + "s";
}

/* ==========================================================================
   3. Storage
   ========================================================================== */
function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch (e) { return {}; }
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      userId: S.userId, username: S.username, plays: S.plays,
      pendingSync: S.pendingSync, manifest: S.cachedManifest
    }));
  } catch (e) { /* private mode — the game still runs for this session */ }
}
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
    var r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* ==========================================================================
   4. State
   ========================================================================== */
var persisted = load();
var S = {
  screen: "boot",
  userId: persisted.userId || null,   // minted by the Sheet on first username submit
  username: persisted.username || "",
  plays: persisted.plays || {},
  pendingSync: persisted.pendingSync || [],
  cachedManifest: persisted.manifest || null,
  manifest: null,
  today: lagosDay(),
  roundIndex: 0,
  roundStartedAt: 0,
  results: [],
  lastResult: null,
  todayPoints: 0,
  ui: { detailDate: null, returnTo: "played", bootPct: 0, error: null }
};


/* ==========================================================================
   5. Helpers
   ========================================================================== */
var esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
};
function num(n) { return Number(n || 0).toLocaleString("en-US"); }
function naira(n) { return "\u20A6" + num(n); }
function cfg(k) { return (S.manifest && S.manifest.config && S.manifest.config[k]); }
function firstName(u) {
  var t = String(u || "").split(/[._\-\s]+/)[0] || "there";
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function validUsername(v) {
  var u = String(v || "").trim().replace(/^@+/, "");
  return /^[A-Za-z0-9._-]{3,30}$/.test(u) ? u : null;
}
function fmtDate(iso) {
  var p = iso.split("-");
  var months = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
  return (+p[2]) + " " + months[+p[1] - 1] + " " + p[0];
}
function relDay(iso) {
  if (iso === S.today) return "Today";
  if (iso === lagosDay(new Date(Date.now() - 86400000))) return "Yesterday";
  var p = iso.split("-");
  var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return (+p[2]) + " " + m[+p[1] - 1];
}

/* Client awards coupons by point threshold immediately.
   Ops verifies username and credits in the Sheet within 24 hours. */
function couponForPoints(pts, cfg) {
  if (pts >= cfg.tier3000Pts) return cfg.coupon3000;
  if (pts >= cfg.tier2000Pts) return cfg.coupon2000;
  if (pts >= cfg.tier1000Pts) return cfg.coupon1000;
  return 0;
}

function rewardLabelOf(coupon, cash) {
  var parts = [];
  if (coupon > 0) parts.push(naira(coupon) + " trading fee coupon");
  if (cash > 0) parts.push(naira(cash) + " cash");
  return parts.join(" + ");
}

/* Fetch the published Sheet range of verified plays (ops-filled).
   Ops updates: credited_at (timestamp), cash_amount, verified_status. */
function fetchOpsVerification(username) {
  if (!CFG.opsRange) return Promise.resolve(null);
  return fetch(CFG.opsRange + "&tq=select A,B,D,J,M,O where D = '" + encodeURIComponent(username) + "'")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (resp) {
      var data = resp.replace(/^[^\{]*/, '').replace(/[^\}]*$/, '');
      var json = JSON.parse(data);
      if (!json.rows || !json.rows.length) return null;
      var row = json.rows[0];
      return { date: row.c[1].v, creditedAt: row.c[3].v, cashAmount: row.c[4].v || 0, verifiedStatus: row.c[5].v || "" };
    })
    .catch(function () { return null; });
}

/* ==========================================================================
   6. Network — GET manifest from CDN, POST results to Cloudflare Worker
   ========================================================================== */
function fetchManifest() {
  if (!CFG.CDN_BASE) return Promise.reject(new Error("no CDN_BASE configured"));
  var url = CFG.CDN_BASE.replace(/\/$/, "") + "/public/daily/today.json?v=" + S.today;
  return fetch(url, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("manifest " + r.status);
    return r.json();
  });
}

function post(payload) {
  if (!CFG.WEB_APP_URL) return Promise.reject(new Error("no WEB_APP_URL configured"));
  return fetch(CFG.WEB_APP_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight
    body: JSON.stringify(payload)
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.ok) throw new Error("rejected: " + (j.error || "unknown"));
    return j;
  });
}

function queue(payload, callback) {
  S.pendingSync.push({ payload: payload, callback: callback });
  save();
  flush();
}
/* Retry queued posts. A failed POST must never cost a player their reward. */
function flush() {
  if (!CFG.WEB_APP_URL || !S.pendingSync.length) return;
  var item = S.pendingSync[0];
  post(item.payload).then(function (resp) {
    if (item.callback) item.callback(resp);
    S.pendingSync.shift();
    save();
    flush();
  }).catch(function () { /* stays queued for the next load */ });
}

function meta() {
  return { ua: navigator.userAgent, tz: Intl.DateTimeFormat().resolvedOptions().timeZone };
}

/* ==========================================================================
   7. Boot — manifest, then preload all four images before round 1
   ========================================================================== */
function boot() {
  render();
  flush();
  fetchManifest().then(function (m) {
    if (m && m.date && m.date !== S.today) {
      console.warn("[dgw] manifest date", m.date, "!= Lagos day", S.today, "— publish may not have run");
    }
    return m;
  }).catch(function () {
    return S.cachedManifest || Object.assign({}, DEMO, { date: S.today });
  }).then(function (m) {
    if (!m || !m.rounds || m.rounds.length !== 4) throw new Error("bad manifest");
    S.manifest = m;
    S.cachedManifest = m;
    save();
    if (m.campaignActive === false) { S.screen = "closed"; render(); return; }
    // Daily gate first — a returning player should never wait on a preload.
    if (S.plays[S.today]) {
      S.screen = "played"; render();
      checkOpsVerification().then(function () { if (S.screen === "played") render(); });
    }
    checkOpsVerification();
    var pre = preload(m.rounds.map(function (r) { return r.image; }));
    // A first-timer reads the intro while the images come down behind it.
    if (!S.username) { S.screen = "intro"; render(); return; }
    return pre.then(start);
  }).catch(function (e) {
    S.ui.error = e.message;
    S.screen = "error";
    render();
  });
}

function preload(urls) {
  var done = 0, total = urls.length;
  return new Promise(function (resolve) {
    var settled = false;
    var finish = function () { if (!settled) { settled = true; resolve(); } };
    setTimeout(finish, 8000); // start anyway rather than stall the player
    urls.forEach(function (u) {
      var img = new Image();
      var tick = function () {
        done++;
        S.ui.bootPct = Math.round(done / total * 100);
        var bar = document.getElementById("bootbar");
        if (bar) bar.style.width = S.ui.bootPct + "%";
        if (done === total) finish();
      };
      img.onload = tick; img.onerror = tick; img.src = u;
    });
  });
}

/* Cold path only: no local userId means a cleared cache, a reinstall or a genuinely
   new player. Ask the Sheet who this username is and rebuild the daily gate from it.
   Fails OPEN — a slow or dead Apps Script must not lock a real player out. The Sheet
   is still the source of truth for what actually gets paid. */
function restoreThenStart() {
  if (S.userId && Object.keys(S.plays).length) return start();
  S.screen = "checking";
  render();

  var settled = false;
  var go = function () {
    if (settled) return;
    settled = true;
    if (!S.userId) S.userId = uuid();   // offline fallback; logPlay reconciles it later
    save();
    start();
  };
  if (!CFG.WEB_APP_URL) return go();
  setTimeout(go, 6000);

  post({ secret: CFG.API_SECRET, action: "restoreUser", username: S.username, meta: meta() })
    .then(function (j) {
      if (j.userId) S.userId = j.userId;
      if (j.plays) Object.keys(j.plays).forEach(function (d) {
        if (!S.plays[d]) S.plays[d] = j.plays[d];
      });
      go();
    })
    .catch(go);
}

function start() {
  if (S.plays[S.today]) { S.screen = "played"; return render(); }
  if (!S.username) { S.screen = "intro"; return render(); }
  S.roundIndex = 0; S.results = []; S.todayPoints = 0;
  S.screen = "round"; render(); startRound();
}

/* ==========================================================================
   8. Round engine — wall-clock deltas only, never accumulated ticks
   ========================================================================== */
var raf = null;
var els = {};

function startRound() {
  S.roundStartedAt = Date.now();
  els = {
    img: document.getElementById("cardimg"),
    sec: document.getElementById("secs"),
    pts: document.getElementById("pts"),
    ring: document.getElementById("ring")
  };
  loop();
}

function elapsed() { return (Date.now() - S.roundStartedAt) / 1000; }

function pointsAt(t) {
  var max = cfg("maxPoints"), min = cfg("minPoints"), len = cfg("roundSeconds");
  var raw = max - (max - min) * Math.min(t, len) / len;
  // snapped to 10s — the player is awarded exactly the number they were shown
  return Math.max(min, Math.round(raw / 10) * 10);
}

function loop() {
  if (S.screen !== "round") return;
  var len = cfg("roundSeconds"), t = elapsed(), p = Math.min(t / len, 1);
  if (els.img) {
    els.img.style.filter = "blur(" + (15 * (1 - p)).toFixed(2) + "px)";
    els.img.style.transform = "scale(" + (1 + 0.12 * (1 - p)).toFixed(4) + ")";
  }
  if (els.sec) els.sec.textContent = Math.max(0, Math.ceil(len - t));
  if (els.pts) els.pts.textContent = num(pointsAt(t));
  if (els.ring) els.ring.style.strokeDashoffset = (169.6 * p).toFixed(1);
  if (t >= len) return resolveRound(null, true);
  raf = requestAnimationFrame(loop);
}

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState !== "visible" || S.screen !== "round") return;
  if (elapsed() >= cfg("roundSeconds")) resolveRound(null, true); // ran out while hidden
  else { cancelAnimationFrame(raf); loop(); }
});

/* picked = null for a timeout or a skip */
function resolveRound(picked, timedOut) {
  if (S.screen !== "round") return;
  cancelAnimationFrame(raf);
  var t = Math.min(elapsed(), cfg("roundSeconds"));
  var r = S.manifest.rounds[S.roundIndex];
  var correct = picked !== null && picked === r.answer;
  var pts = correct ? pointsAt(t) : 0;
  S.todayPoints += pts;
  S.lastResult = {
    correct: correct, picked: picked, answer: r.answer, points: pts,
    seconds: Math.round(t * 10) / 10, timedOut: !!timedOut, image: r.image
  };
  S.results.push({
    round: S.roundIndex + 1, answer: r.answer, picked: picked,
    points: pts, seconds: S.lastResult.seconds, image: r.image
  });
  S.screen = "reveal";
  render();
}

function nextRound() {
  if (S.roundIndex < 3) {
    S.roundIndex++;
    S.screen = "round";
    render();
    startRound();
  } else {
    finishDay();
  }
}

/* The play record is written locally BEFORE any network call.
   No reward is computed here — rank decides it, and rank isn't known until midnight. */
function finishDay() {
  var correctCount = S.results.filter(function (r) { return r.picked === r.answer; }).length;
  var coupon = couponForPoints(S.todayPoints, cfg("config"));
  S.plays[S.today] = {
    points: S.todayPoints,
    correctCount: correctCount,
    rewardType: coupon > 0 ? "coupon" : "none",
    rewardAmount: coupon,
    rank: null,       // server fills on response
    topTen: false,    // server fills on response
    cashAmount: 0,    // ops may add cash if top 10 (will show ₦2,000 if topTen is true)
    rewardLabel: coupon > 0 ? naira(coupon) + " trading fee coupon" : "",
    username: S.username,
    results: S.results.slice(),
    creditedAt: null,
    verifiedStatus: ""
  };
  save();
  queue({
    secret: CFG.API_SECRET, action: "logPlay",
    userId: S.userId, username: S.username, playDate: S.today,
    totalPoints: S.todayPoints, correctCount: correctCount,
    rounds: S.results.map(function (r) {
      return { index: r.round, answer: r.answer, picked: r.picked, points: r.points, seconds: r.seconds };
    }),
    meta: meta()
  }, function (resp) {
    // Server returns rank and topTen from logPlay
    if (resp.rank) S.plays[S.today].rank = resp.rank;
    if (resp.topTen) S.plays[S.today].topTen = resp.topTen;
    save();
    render();  // re-render screen 5 with top 10 info
  });
  S.screen = "submitted";
  render();
}

/* Fetch ops verification for any unfilled plays. Ops fills: credited_at, cash, verified_status. */
function checkOpsVerification() {
  return fetchOpsVerification(S.username)
    .then(function (ops) {
      if (!ops) return;
      Object.keys(S.plays).forEach(function (d) {
        if (S.plays[d].creditedAt) return;  // already filled
        if (d === ops.date) {
          S.plays[d].creditedAt = ops.creditedAt;
          S.plays[d].cashAmount = ops.cashAmount || 0;
          S.plays[d].verifiedStatus = ops.verifiedStatus || "";
        }
      });
      save();
    })
    .catch(function () { });
}

    '<div style="padding-bottom:26px"><button class="cta lime" data-act="trade">Back to trading</button>' +
      '<div style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:16px">' +
        '<button data-act="history" data-v="played" style="font-size:15px;font-weight:700;color:#fff">View my history</button>' +
        '<span style="width:1px;height:14px;background:rgba(255,255,255,0.4)"></span>' +
        '<button data-act="editUser" style="font-size:15px;font-weight:700;color:var(--lime)">Change username</button>' +
      "</div></div>" +
    "</div>";
};

/* ---------- 8. change username ---------- */
V_username = function () {
  return '<div class="safe"></div><div class="view fade" style="padding:0 24px">' +
    '<div class="scroll">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;padding-top:10px">' +
        '<span style="font-size:24px;font-weight:800">Your username</span>' +
        '<button class="closebtn" data-act="cancelUser" aria-label="Close">\u00D7</button>' +
      "</div>" +
      '<div style="margin-top:20px;background:var(--o-surface);border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        "<span><span style=\"display:block;font-size:13px;font-weight:700;color:var(--t-3)\">Currently saved</span>" +
        '<span style="display:block;font-size:19px;font-weight:800;margin-top:2px">@' + esc(S.username) + "</span></span>" +
        '<span style="background:rgba(204,255,0,0.2);color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.08em;border-radius:999px;padding:8px 12px">IN USE</span>' +
      "</div>" +
      '<div style="margin-top:20px;display:flex;flex-direction:column;gap:8px">' +
        '<label for="uinput" style="font-size:15px;font-weight:700">New username</label>' +
        '<div id="ushell" style="background:var(--o-control);border:1.5px solid var(--lime);border-radius:16px;padding:17px 18px">' +
          '<input id="uinput" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + esc(S.username) + '" ' +
          'style="width:100%;background:none;border:0;outline:none;color:#fff;font-size:17px;font-weight:700;caret-color:var(--lime)">' +
        "</div>" +
        '<span id="uhelp" style="font-size:14px;font-weight:600;color:rgba(255,255,255,0.75);line-height:1.4">We don\u2019t verify usernames, so check the spelling against your TradeCard account.</span>' +
      "</div>" +
      '<div style="margin-top:18px;background:var(--o-surface);border-left:4px solid var(--lime);border-radius:14px;padding:16px 18px">' +
        '<div style="font-size:15px;font-weight:800">Takes effect from your next game</div>' +
        '<div style="margin-top:4px;font-size:14px;font-weight:600;color:rgba(255,255,255,0.8);line-height:1.4">Rewards already won are on their way to @' + esc(S.username) + ". Contact support if that account is wrong.</div>" +
      "</div><div style='height:20px'></div>" +
    "</div>" +
    '<div style="padding-bottom:26px"><button class="cta lime" id="usave" data-act="saveEdit">Save username</button>' +
    '<button class="linkbtn" style="margin-top:6px;color:var(--t-2)" data-act="cancelUser">Cancel</button></div>' +
    "</div>";
};

/* ---------- 9/11. history list ---------- */
function playDates() {
  return Object.keys(S.plays).sort().reverse();
}
function totalWon() {
  return playDates().reduce(function (a, d) {
    var p = S.plays[d];
    var credited = p.creditedAt ? Number(p.rewardAmount || 0) + Number(p.cashAmount || 0) : 0;
    var pending = Number(p.rewardAmount || 0) + (p.topTen ? 2000 : 0);
    return a + (credited || pending);
  }, 0);
}
function streak() {
  var n = 0;
  for (var i = 0; i < 400; i++) {
    var d = lagosDay(new Date(Date.now() - i * 86400000));
    if (S.plays[d]) n++;
    else if (i === 0) continue;   // today not played yet — an earlier streak still stands
    else break;
  }
  return n;
}
function hHeader(title) {
  return '<div class="hhead">' +
    '<div style="display:flex;align-items:center;justify-content:space-between">' +
      '<span style="font-size:24px;font-weight:800">' + esc(title) + "</span>" +
      '<button class="closebtn" data-act="closeHistory" aria-label="Close">\u00D7</button>' +
    "</div>";
}

V_history = function () {
  var dates = playDates();
  if (!dates.length) return V_emptyHistory();
  var rows = dates.map(function (d) {
    var p = S.plays[d];
    var settled = p.rewardType !== "pending" && p.rewardType !== "confirming";
    var won = settled && p.rewardType !== "none";
    var bg = !settled ? "#EEF1F6" : p.cashAmount > 0 ? "var(--lime-tint)" : won ? "var(--info)" : "#EEF1F6";
    var fg = !settled ? "var(--muted)" : p.cashAmount > 0 ? "var(--lime-text-2)" : won ? "var(--blue)" : "var(--muted)";
    return '<button class="row" data-act="detail" data-v="' + d + '">' +
      '<span class="ricon" style="background:' + bg + ';color:' + fg + '">' + (verified && (won || topTen) ? "\u2713" : won || topTen ? "\u00B7" : "\u2014") + "</span>" +
      "<span style=\"flex:1;min-width:0\"><span style=\"display:block;font-size:16px;font-weight:800;color:" + (won ? "var(--ink)" : "var(--slate)") + '">' +
        esc((won || topTen) ? (verified ? "Credited" : "Pending") : "No reward") + "</span>" +
      '<span style="display:block;font-size:13px;font-weight:600;color:var(--slate);margin-top:2px">' + esc(relDay(d)) + " \u00B7 " + num(p.points) + " pts</span></span>" +
      '<span style="font-size:18px;font-weight:700;color:var(--muted)">\u203A</span></button>';
  }).join("");

  return '<div class="view lightbg fade">' + hHeader("My history") +
    '<div style="display:flex;gap:12px;margin-top:18px">' +
      '<div class="stat"><div style="font-size:13px;font-weight:600;color:var(--t-2)">Total won</div>' +
        '<div style="font-size:22px;font-weight:800;color:var(--lime);margin-top:2px">' + naira(totalWon()) + "</div></div>" +
      '<div class="stat"><div style="font-size:13px;font-weight:600;color:var(--t-2)">Day streak</div>' +
        '<div style="font-size:22px;font-weight:800;margin-top:2px">' + streak() + "</div></div>" +
    "</div></div>" +
    '<div class="scroll"><div style="padding:20px 20px 30px;display:flex;flex-direction:column;gap:10px">' + rows + "</div></div>" +
    "</div>";
};

V_emptyHistory = function () {
  return '<div class="view lightbg fade">' + hHeader("My history") + "</div>" +
    '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 44px;margin-top:-60px;gap:14px">' +
      '<div class="tile" style="width:120px;height:120px;border-radius:28px"><img src="' + ART.empty + '" alt=""></div>' +
      '<span style="font-size:24px;font-weight:800;color:var(--ink)">Nothing here yet</span>' +
      '<span style="font-size:16px;font-weight:600;color:var(--slate);line-height:1.45">Play today\u2019s game and your wins will show up here.</span>' +
    "</div>" +
    '<div style="padding:0 24px 30px"><button class="cta lime" data-act="closeHistory">Play today\u2019s game</button></div>' +
    "</div>";
};

/* ---------- 10. history detail ---------- */
V_historyDetail = function () {
  var d = S.ui.detailDate, p = S.plays[d];
  if (!p) { S.screen = "history"; return V_history(); }
  var won = p.rewardType !== "none" && p.rewardAmount > 0;
  var topTen = p.topTen;
  var totalAmount = p.rewardAmount + (topTen ? 2000 : 0);
  var verified = p.creditedAt || p.verifiedStatus;
  var rounds = p.results.map(function (r) {
    var ok = r.picked === r.answer;
    return '<div style="display:flex;align-items:center;gap:12px">' +
      '<img class="thumb" src="' + esc(r.image || "") + '" alt="">' +
      "<span style=\"flex:1;min-width:0\"><span style=\"display:block;font-size:15px;font-weight:700;color:" + (ok ? "var(--ink)" : "var(--slate)") + '">Round ' + r.round + " \u00B7 " + esc(r.answer) + "</span>" +
      '<span style="display:block;font-size:13px;font-weight:600;color:var(--slate);margin-top:1px">' + (ok ? "Correct in " + r.seconds.toFixed(1) + "s" : "Missed") + "</span></span>" +
      "<span style=\"font-size:15px;font-weight:800;color:" + (ok ? "var(--blue)" : "var(--muted)") + '">' + (ok ? num(r.points) : "0") + "</span></div>";
  }).join("");

  var reward = won
    ? '<span style="font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--slate)">' +
        esc(p.rank ? "FINISHED #" + p.rank : "PRIZE") + "</span>" +
      '<span style="font-size:38px;font-weight:800;color:var(--blue);letter-spacing:-.03em;line-height:1.1">' +
        naira(Number(p.rewardAmount || 0) + Number(p.cashAmount || 0)) + "</span>" +
      '<span style="font-size:16px;font-weight:700;color:var(--ink)">' + esc(p.rewardLabel) +
        " \u00B7 to @" + esc(p.username) + "</span>" +
      '<span style="margin-top:10px;background:var(--lime-tint);color:var(--lime-text);font-size:13px;font-weight:800;padding:9px 16px;border-radius:999px">' +
        esc(p.creditedAt ? "Credited " + p.creditedAt : "Credited within 1 working day") + "</span>"
    : '<span style="font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--slate)">' +
        esc(settled ? "NO PRIZE" : "RESULT PENDING") + "</span>" +
      '<span style="font-size:38px;font-weight:800;color:var(--blue);letter-spacing:-.03em;line-height:1.1">' + num(p.points) + "</span>" +
      '<span style="font-size:16px;font-weight:700;color:var(--ink)">' +
        esc(settled ? "points \u00B7 below the cut-off" : "points \u00B7 rankings not settled yet") + "</span>";

  return '<div class="view lightbg fade">' +
    '<div class="hhead" style="padding-bottom:22px"><div style="display:flex;align-items:center;justify-content:space-between">' +
      '<span style="font-size:24px;font-weight:800">' + esc(fmtDate(d)) + "</span>" +
      '<button class="closebtn" data-act="closeHistory" aria-label="Close">\u00D7</button></div></div>' +
    '<div class="scroll"><div style="padding:20px 20px 30px;display:flex;flex-direction:column;gap:12px">' +
      '<div style="background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;box-shadow:0 6px 20px rgba(11,18,32,0.06)">' + reward + "</div>" +
      '<div style="background:#fff;border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 20px rgba(11,18,32,0.06)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between">' +
          '<span style="font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--slate)">ROUND BY ROUND</span>' +
          '<span style="font-size:15px;font-weight:800;color:var(--ink)">' + num(p.points) + " pts</span></div>" +
        rounds +
      "</div>" +
      '<button class="cta blue" data-act="backHistory" style="margin-top:4px">Back to history</button>' +
    "</div></div></div>";
};

/* ==========================================================================
   10. Render
   ========================================================================== */
var VIEWS = {
  boot: V_boot, checking: V_checking, error: V_error, closed: V_closed, intro: V_intro, round: V_round,
  reveal: V_reveal, submitted: V_submitted, played: V_played,
  username: V_username, history: V_history, historyDetail: V_historyDetail
};

var cdTimer = null;
function render() {
  root.innerHTML = (VIEWS[S.screen] || V_boot)();
  if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }

  var cds = root.querySelectorAll(".cdown");
  if (cds.length) {
    var tick = function () {
      var left = nextLagosMidnight() - Date.now();
      if (left <= 0) return location.reload(); // rolled past midnight WAT
      for (var i = 0; i < cds.length; i++) cds[i].textContent = countdownText(left);
    };
    tick();
    cdTimer = setInterval(tick, 1000);
  }

  var input = document.getElementById("uinput");
  if (input) {
    var sync = function () {
      var ok = !!validUsername(input.value);
      var btn = document.getElementById("usave");
      var help = document.getElementById("uhelp");
      if (btn) btn.disabled = !ok;
      if (help) help.style.color = (!ok && input.value.trim().length > 0)
        ? "#FFD5D5" : (S.screen === "intro" ? "rgba(255,255,255,0.72)" : "rgba(255,255,255,0.75)");
    };
    input.addEventListener("input", sync);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && validUsername(input.value)) {
        document.getElementById("usave").click();
      }
    });
    sync();
  }
}

/* ==========================================================================
   11. Events
   ========================================================================== */
root.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act"), v = el.getAttribute("data-v");

  if (act === "answer") return resolveRound(v, false);
  if (act === "skip")   return resolveRound(null, false);
  if (act === "next")   return nextRound();
  if (act === "retry")  { S.screen = "boot"; S.ui.bootPct = 0; return boot(); }
  if (act === "trade")  { window.close(); return; }

  if (act === "saveNew") {
    var u1 = validUsername(document.getElementById("uinput").value);
    if (!u1) return;
    S.username = u1; save();
    return restoreThenStart();
  }
  if (act === "editUser") { S.screen = "username"; return render(); }
  if (act === "cancelUser") { S.screen = "played"; return render(); }
  if (act === "saveEdit") {
    var u2 = validUsername(document.getElementById("uinput").value);
    if (!u2) return;
    var prev = S.username;
    S.username = u2; save();
    if (u2 !== prev) {
      queue({ secret: CFG.API_SECRET, action: "updateUsername", userId: S.userId,
              username: u2, previous: prev, meta: meta() });
    }
    S.screen = "played";
    return render();
  }

  if (act === "history") { S.ui.returnTo = v || "played"; S.screen = "history"; return render(); }
  if (act === "detail")  { S.ui.detailDate = v; S.screen = "historyDetail"; return render(); }
  if (act === "backHistory") { S.screen = "history"; return render(); }
  if (act === "closeHistory") { S.screen = S.ui.returnTo; return render(); }


});

/* Roll the day over without a reload if the tab is left open past midnight WAT */
setInterval(function () {
  var d = lagosDay();
  if (d !== S.today) location.reload();
}, 30000);

boot();
})();
</script>
</body>
</html>

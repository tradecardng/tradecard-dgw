name: Daily Automation

on:
  schedule:
    # Publish cards at 00:00 Lagos time (23:00 UTC the previous day)
    - cron: '0 23 * * *'
    # Settle at 00:01 Lagos time (23:01 UTC the previous day)
    - cron: '1 23 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Publish today's cards
        run: node .github/workflows/card-publisher.js
      
      - name: Commit card publication
        run: |
          git config user.name "Card Publisher Bot"
          git config user.email "noreply@github.com"
          git add public/daily/today.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Publish today's cards"
          git push

  settle:
    runs-on: ubuntu-latest
    needs: publish
    
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Run settlement
        run: node .github/workflows/settle.js
      
      - name: Commit settlement
        run: |
          git config user.name "Settlement Bot"
          git config user.email "noreply@github.com"
          git add public/daily/opsPublished.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily settlement: identify top 10 and generate ops data"
          git push

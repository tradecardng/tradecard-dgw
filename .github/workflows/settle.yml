name: Daily Settlement

on:
  schedule:
    # Run at 00:01 Lagos time (23:01 UTC the previous day)
    - cron: '1 23 * * *'
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Run settlement
        run: node .github/workflows/settle.js
        env:
          TODAY_DATE: ${{ env.TODAY_DATE }}
      
      - name: Commit changes
        run: |
          git config user.name "Settlement Bot"
          git config user.email "noreply@github.com"
          git add public/daily/*/opsPublished.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily settlement: identify top 10 and generate ops data"
          git push
